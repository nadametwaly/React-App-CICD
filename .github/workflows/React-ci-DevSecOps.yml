name: DevSecOps CI Pipeline

on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20
      - name: Installing Dependencies
        run: npm install
      - name: lint Phase
        run:  npm run lint
      - name: unit test
        run: npm run test
      - name: Building Static Files
        run: npm run build 
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
            languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Trivy     #vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
            image-ref: 'ghcr.io/${{ github.actor }}/react-app-cicd:${{ github.sha }}'
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
            sarif_file: 'trivy-results.sarif'

      - name: Run Gitleaks  #for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          format: sarif
          output: gitleaks-results.sarif
        continue-on-error: true  #runs despite issues
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
            sarif_file: gitleaks-results.sarif
            
  
  
