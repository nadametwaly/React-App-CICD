name: Service Containers Practice
on: 
    push:
    workflow_dispatch:
permissions:
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:   #Default container port 80 is already exposed internally
      nginx:
        image: nginx:alpine

      apache:
        image: httpd:2.4

    steps:
      - name: Wait for services to start
        run: |
          echo "Waiting for services to start..."
          # Wait until NGINX responds
          for i in {1..10}; do
            if curl -s http://nginx > /dev/null; then
              echo "NGINX is up!"
              break
            fi
            echo "Waiting for NGINX..."
            sleep 2
          done
          # Wait until Apache responds
          for i in {1..10}; do
            if curl -s http://apache > /dev/null; then
              echo "Apache is up!"
              break
            fi
            echo "Waiting for Apache..."
            sleep 2
          done
      - name: Check NGINX Service
        run: |
          echo "Checking NGINX service..."
          curl -f http://nginx

      - name: Check Apache Service
        run: |
          echo "Checking Apache service..."
          curl -f http://apache