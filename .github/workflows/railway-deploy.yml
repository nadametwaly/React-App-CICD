name: Container Jobs for Railway Deployment
on: workflow_dispatch
permissions:
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 20
      - name: Installing Dependencies
        run: npm install
      - name: Lint Phase
        run: npm run lint
      - name: Unit Test
        run: npm run test
      - name: Building Static Files
        run: npm run build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/react-app-cicd:${{ github.sha }}
            ghcr.io/${{ github.actor }}/react-app-cicd:latest
          context: .
  
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    container:
        image: ghcr.io/railwayapp/cli:latest
    env:
        RAILWAY_TOKEN: ${{ secrets.API_TOKEN }}
        SVC_NAME: react-app-cicd
    steps:
        - name: Deploy Docker Image to Railway
          run: |
            railway redeploy --service=$SVC_NAME -y